[package]
name = "reqwester"
description = "A small toolkit for building type-safe API clients"
version = "0.1.1"
edition.workspace = true
repository.workspace = true
license.workspace = true
readme = "../../README.md"

[features]
default = []
macros = ["dep:reqwester-macros"]
# Wrappers (retries...), re-exported as `reqwester::util`, and the matching `#[requester]` adapters.
util = ["dep:reqwester-util", "reqwester-macros?/util"]

[dependencies]
reqwester-core = { path = "../reqwester-core", version = "0.1.0" }
reqwester-macros = { path = "../reqwester-macros", version = "0.1.0", optional = true }
reqwester-util = { path = "../reqwester-util", version = "0.1.0", optional = true }

[dev-dependencies]
reqwester = { path = ".", features = ["macros", "util"] }
futures-core = "0.3"
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }
